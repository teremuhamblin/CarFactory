# ============================================================
# CarFactory v2.1 — vehicle.conf
# Configuration tactique principale
# ============================================================

# ------------------------------------------------------------
# 1. Informations véhicule
# ------------------------------------------------------------
VEHICLE_MARKET="EU"          # EU / US / JP / KR
VEHICLE_TYPE="HYBRID"        # THERMAL / HYBRID / EV
VEHICLE_ID="CF-UNIT-01"      # Identifiant tactique

# ------------------------------------------------------------
# 2. SECUREOPS — Modes de sécurisation
# ------------------------------------------------------------
# silent   = aucune sortie console, logs cryptés uniquement
# verbose  = informations détaillées
# redacted = sortie filtrée, données sensibles masquées
SECUREOPS="verbose"

# ------------------------------------------------------------
# 3. Journalisation
# ------------------------------------------------------------
LOG_LEVEL="ADVANCED"         # BASIC / ADVANCED
LOG_ENCRYPTION="AES256"      # AES256 obligatoire
LOG_ROTATION="ENABLED"       # rotation automatique des logs

# ------------------------------------------------------------
# 4. Modules — Activation / Désactivation
# ------------------------------------------------------------
MODULE_DIAG_BASIC="ON"
MODULE_DIAG_ENGINE="ON"
MODULE_DIAG_HYBRID="ON"
MODULE_DIAG_EV="ON"

MODULE_OBD_CORE="ON"
MODULE_OBD_EXTENDED="ON"

MODULE_TELEMETRY_LOCAL="ON"
MODULE_REPORT_ADVANCED="ON"
MODULE_SITREP_EXTENDED="ON"

# ------------------------------------------------------------
# 5. Plugins — Extensions tactiques
# ------------------------------------------------------------
PLUGIN_SENTINEL="ON"
PLUGIN_BLACKBOX="ON"
PLUGIN_WATCHDOG="OFF"        # sera activé lors de la création du plugin
PLUGIN_INTEGRITY="OFF"       # idem
PLUGIN_MARKET_AUTODETECT="OFF"

# ------------------------------------------------------------
# 6. Intégrité — Vérifications internes
# ------------------------------------------------------------
INTEGRITY_CHECK="ENABLED"    # vérification des modules
INTEGRITY_HASH="SHA256"      # hash obligatoire
INTEGRITY_FAIL_ACTION="HALT" # HALT / WARN

# ------------------------------------------------------------
# 7. Watchdog — Surveillance interne
# ------------------------------------------------------------
WATCHDOG_MODE="PASSIVE"      # PASSIVE / ACTIVE
WATCHDOG_FAIL_ACTION="RESTART" # RESTART / HALT / IGNORE

# ------------------------------------------------------------
# 8. Paramètres tactiques
# ------------------------------------------------------------
OUTPUT_FORMAT="TACTICAL"     # STANDARD / TACTICAL
TIMESTAMP_FORMAT="MILITARY"  # MILITARY / ISO
